<title>Sabana Study – Prototipo</title>
<meta name="description" content="Prototipo navegable de Sabana Study: reserva de salas de estudio con check-in QR y liberación automática.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: lista de pantallas | teléfono navegable | notas de diseño. En móvil se apila con el teléfono primero. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --fg:#0e1b33; --muted:#5b6780; --line:#dbe1ec; --accent:#0b3d91; --accent-fg:#ffffff; --soft:#e6edfa;
  --p-bg:#ffffff; --p-fg:#0e1b33; --p-mut:#5b6780; --p-line:#dbe1ec; --p-blue:#0b3d91; --p-blue2:#1c5bd6; --p-soft:#e6edfa;
  --p-green:#1f9d55; --p-green-s:#e3f5ea; --p-amber:#c98a00; --p-amber-s:#fff3d1; --p-red:#c8372d; --p-red-s:#fde8e6; --p-gray-s:#eef0f4;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#131c30;--fg:#e8edf7;--muted:#9aa7c0;--line:#25324d;--accent:#7fa8f5;--accent-fg:#0b1220;--soft:#1a2745;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#131c30;--fg:#e8edf7;--muted:#9aa7c0;--line:#25324d;--accent:#7fa8f5;--accent-fg:#0b1220;--soft:#1a2745;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;padding-inline:16px;padding-block:24px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:24px}
header h1{font-family:var(--display);font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:-.02em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:28px;align-items:start}
.grid>*{min-width:0}
.steps{display:grid;gap:4px;position:sticky;top:16px}
.steps h2,.notes h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--fg)}
.steps button:hover{background:var(--soft)}
.steps button:focus-visible,.pbtn:focus-visible,.row:focus-visible,.chip:focus-visible{outline:3px solid var(--p-blue2);outline-offset:2px}
.steps button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.steps i{font-style:normal;font-variant-numeric:tabular-nums;font-size:12px;width:20px;opacity:.7}
.steps .grp{font-size:11px;color:var(--muted);margin:10px 10px 2px;letter-spacing:.06em;text-transform:uppercase}
.stage{display:flex;justify-content:center}
.phone{width:372px;max-width:100%;height:760px;background:#0e1b33;border-radius:44px;padding:11px;box-shadow:0 24px 60px rgba(11,29,60,.28)}
.screen{position:relative;height:100%;background:var(--p-bg);color:var(--p-fg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.body{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:8px;min-height:36px}
.back{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--p-gray-s);font-size:18px}
h3.t{font-family:var(--display);font-size:24px;line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--p-mut);font-size:14px;margin:0}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;width:100%;padding:15px 16px;border-radius:14px;background:var(--p-blue);color:#fff;font-weight:700;font-size:16px}
.pbtn:hover{background:var(--p-blue2)}
.pbtn.soft{background:var(--p-soft);color:var(--p-blue)}
.pbtn.green{background:var(--p-green)}
.pbtn.amber{background:var(--p-amber-s);color:#7a5200}
.pbtn.ghost{background:transparent;color:var(--p-mut);font-weight:600;padding:10px}
.pbtn.sim{background:transparent;border:1.5px dashed var(--p-line);color:var(--p-mut);font-size:13px;font-weight:600;padding:10px}
.card{border:1px solid var(--p-line);border-radius:16px;padding:14px;display:grid;gap:6px}
.center{text-align:center;align-items:center}
.icon-big{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:8px auto 0}
.icon-big svg{width:38px;height:38px}
.ok{background:var(--p-green-s);color:var(--p-green)} .warn{background:var(--p-amber-s);color:var(--p-amber)} .bad{background:var(--p-red-s);color:var(--p-red)} .gray{background:var(--p-gray-s);color:var(--p-mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;width:fit-content}
.pill.free{background:var(--p-green-s);color:var(--p-green)} .pill.busy{background:var(--p-red-s);color:var(--p-red)} .pill.soon{background:var(--p-amber-s);color:#7a5200} .pill.done{background:var(--p-gray-s);color:var(--p-mut)}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--p-line);border-radius:14px}
.row:hover{border-color:var(--p-blue2);background:var(--p-soft)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.free{background:var(--p-green)} .dot.busy{background:var(--p-red)} .dot.soon{background:#e8b100} .dot.done{background:#9aa3b5}
.row b{display:block;font-size:15px} .row small{color:var(--p-mut);font-size:13px}
.row .go{margin-left:auto;color:var(--p-mut);font-size:18px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--p-line);font-size:14px}
.fact:last-child{border:0} .fact span{color:var(--p-mut)} .fact b{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:9px 14px;border-radius:12px;border:1.5px solid var(--p-line);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--p-soft);border-color:var(--p-blue2);color:var(--p-blue)}
.lbl{font-weight:700;font-size:14px;margin:4px 0 -4px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--p-gray-s);display:grid;place-items:center;font-size:20px;font-weight:700}
.stepper output{font-size:22px;font-weight:700;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--p-blue)}
.timer.w{color:#a86f00}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--p-line);padding:8px 0 14px;font-size:11px;color:var(--p-mut);font-weight:600}
.tabs button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:2px 14px}
.tabs .on{color:var(--p-blue)}
.toast{position:absolute;left:16px;right:16px;bottom:22px;background:#0e1b33;color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.notif{background:rgba(255,255,255,.96);border:1px solid var(--p-line);border-radius:18px;padding:12px 14px;display:grid;gap:3px;box-shadow:0 10px 30px rgba(11,29,60,.18);cursor:pointer;text-align:left}
.lock{flex:1;background:linear-gradient(160deg,#0b3d91,#1c5bd6 60%,#5b8def);color:#fff;padding:26px 20px;display:flex;flex-direction:column;gap:22px}
.lock .clock{text-align:center;font-family:var(--display);font-size:64px;font-weight:700;margin-top:30px;line-height:1}
.lock .d{text-align:center;opacity:.85;margin-top:-14px}
.notes{display:grid;gap:14px;position:sticky;top:16px}
.notes .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.notes h3{font-family:var(--display);font-size:20px;margin:0;line-height:1.15}
.notes p{margin:0;color:var(--muted);line-height:1.5}
.notes .src{font-size:13px;color:var(--fg);background:var(--soft);padding:8px 10px;border-radius:8px}
.legend{font-size:13px;color:var(--muted)}
@media (max-width:980px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .stage{order:1}.notes{order:2;position:static}.steps{order:3;position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .steps h2,.steps .grp{grid-column:1/-1}
}
@media (max-width:420px){.phone{height:720px;border-radius:38px}}

/* Integración con la app UniSabana */
:root{--p-bg:#f4f4f5;--p-blue:#0a2f6b;--p-blue2:#3a82b9;--p-soft:#e4eef7;--p-line:#e3e6ea;--p-gray-s:#eceef2}
.screen{font-family:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif}

.hero{flex:none;background:linear-gradient(180deg,#00205a 0%,#1d5a9f 100%);color:#fff;padding-bottom:30px}

.sect{font-size:20px;font-weight:700;margin:6px 0 -4px;color:#23272e}
.tiles{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;margin-inline:-2px}

.tile.new{outline:2px solid #3a82b9}

.newsc{background:linear-gradient(160deg,#00205a,#1d5a9f);color:#fff;border-radius:18px;padding:18px;display:grid;gap:10px}

.newsc .pbtn{background:#fff;color:#0a2f6b;width:fit-content;padding:10px 18px}
.cap{font-size:12px;color:var(--p-mut);text-align:center;margin-top:auto}
.tabbar{flex:none;position:relative;display:flex;justify-content:space-around;align-items:flex-end;background:#fff;padding:8px 6px 14px;box-shadow:0 -4px 14px rgba(10,47,107,.08);border-radius:22px 22px 0 0;font-size:12px}
.tabbar button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;color:#0a2f6b;min-width:58px}

.orb{width:54px;height:54px;border-radius:50%;margin-top:-30px;background:radial-gradient(circle at 35% 30%,#3aa0ff,#0a3fae 60%,#03175c);box-shadow:0 4px 12px rgba(10,47,107,.3);border:4px solid #fff;flex:none}

</style>

<body>
<div class="wrap">
  <header>
    <h1>Sabana Study</h1>
    <p>Prototipo 3, versión final. Toca los botones del teléfono para recorrer el flujo o salta a cualquier pantalla desde la lista.</p>
  </header>
  <div class="grid">
    <nav class="steps" id="steps" aria-label="Pantallas"></nav>
    <div class="stage"><div class="phone"><div class="screen" id="screen"></div></div></div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script>
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.2v.1"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 6.5C10.5 5.3 8.3 4.7 5 4.7v13c3.3 0 5.5.6 7 1.8 1.5-1.2 3.7-1.8 7-1.8v-13c-3.3 0-5.5.6-7 1.8z"/></svg>'
};
const ROOMS=[
  {id:'204',name:'Sala 204',place:'Ad Portas',cap:4,st:'free',walk:2,feats:['proyector','tomas'],code:'AS204-1034',x:70,y:60},
  {id:'3',name:'Sala 3',place:'Biblioteca',cap:6,st:'free',walk:5,feats:['silenciosa','tomas'],code:'AS3-2210',x:190,y:40},
  {id:'201',name:'Sala 201',place:'Ad Portas',cap:4,st:'busy',until:'11:00',walk:2,feats:['proyector'],code:'AS201-0871',x:96,y:96},
  {id:'5',name:'Sala 5',place:'Biblioteca',cap:4,st:'soon',mins:12,walk:5,feats:['silenciosa'],code:'AS5-3340',x:214,y:84},
  {id:'112',name:'Sala 112',place:'Ad Portas',cap:8,st:'free',walk:3,feats:['proyector','tomas'],code:'AS112-4502',x:44,y:100}
];
const FEATS={silenciosa:'Silenciosa',proyector:'Proyector',tomas:'Tomas eléctricas'};
const S={screen:'appHome',hist:[],room:ROOMS[0],people:4,dur:60,hour:10,feats:new Set(),booked:false,queue:false,t:0,toast:'',res:[],cur:null};
const KEY='sabana-study-reservas-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({res:S.res,cur:S.cur&&S.cur.id,people:S.people,dur:S.dur,hour:S.hour,feats:[...S.feats]}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;S.res=d.res||[];S.people=d.people||4;S.dur=d.dur||60;S.hour=d.hour||10;S.feats=new Set(d.feats||[]);
  S.cur=S.res.find(r=>r.id===d.cur&&(r.status==='Confirmada'||r.status==='Activa'))||null;if(S.cur){S.room=ROOMS.find(r=>r.id===S.cur.roomId)||ROOMS[0];S.booked=true}}catch(e){}}
const rs=()=>S.cur?S.cur.slot:slot();
function newRes(){const d=new Date();S.cur={id:Date.now(),roomId:S.room.id,name:S.room.name,place:S.room.place,slot:slot(),code:S.room.code,date:d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}),status:'Confirmada'};S.res.unshift(S.cur);S.booked=true}
function setStatus(st){if(S.cur){S.cur.status=st;if(st!=='Confirmada'&&st!=='Activa'){S.cur=null;S.booked=false}}}
const STEPS=[
 ['App UniSabana',[['appHome','Inicio de la app'],['servicios','Servicios']]],
 ['Reservar',[['home','Salas de estudio'],['filters','Buscar y filtrar'],['avail','Disponibilidad'],['detail','Detalle de sala'],['confirm','Confirmación'],['reservas','Mis reservas']]],
 ['Llegar',[['reminder','Recordatorio'],['checkin','Check-in con QR'],['active','Check-in completado']]],
 ['Si no llega',[['warning','Aviso previo'],['released','Reserva liberada'],['alternatives','Alternativas']]],
 ['Sin salas',[['waitlist','Lista de espera'],['freed','Sala disponible']]]
];
const NOTES={
 home:['Reserva próxima a la vista','La cuenta regresiva aparece apenas hay una reserva activa.','Prototipo 2, ahora funcional'],
 filters:['Filtros simples','Fecha, hora, duración y personas. Un solo botón de acción.','Prototipo 2, ahora funcional'],
 avail:['Capacidad visible y estado por color','Cada sala muestra puestos, distancia y si está libre, ocupada o por liberarse.','Prototipo 2, ahora funcional'],
 detail:['Botón Reservar destacado','Capacidad, horario, ubicación y regla de check-in antes de reservar.','Prototipo 2, ahora funcional'],
 appHome:['Integrado a la app UniSabana','Salas de estudio aparece como acceso rápido en el inicio de la app y como una tarjeta de novedades.','Prototipo 3, nuevo'],
 servicios:['Dentro de Servicios','El módulo vive en Servicios, sección Biblioteca, junto a los demás servicios de la universidad.','Prototipo 3, nuevo'],
 reservas:['Reservas guardadas','El historial queda guardado en este dispositivo: activas, finalizadas, canceladas y liberadas.','Prototipo 3, nuevo'],
 confirm:['Confirmación visible','Muestra código, hora de inicio y cuánto tiempo hay para hacer check-in.','Prototipo 2, ahora funcional'],
 reminder:['Recordatorio antes de la reserva','Notificación 15 minutos antes del inicio con acceso directo al check-in.','Prototipo 2, ahora funcional'],
 checkin:['QR como prueba de llegada','Se conserva el QR y se agrega el tiempo restante para escanear.','Prototipo 2, ahora funcional'],
 active:['Estado del check-in visible','La reserva queda activa y se ve cuánto tiempo queda de uso.','Prototipo 2, ahora funcional'],
 warning:['Aviso antes de liberar','Cuenta regresiva y dos opciones claras antes de perder la sala.','Prototipo 2, ahora funcional'],
 released:['Liberación automática','Si no hay check-in, la sala vuelve a estar disponible para otros.','Prototipo 2, ahora funcional'],
 alternatives:['Alternativas cercanas','Otras salas libres ordenadas por distancia, con reserva directa.','Prototipo 2, ahora funcional'],
 waitlist:['Lista de espera','Cuando no hay salas, el estudiante puede esperar en vez de recorrer el campus.','Prototipo 2, ahora funcional'],
 freed:['Aviso de sala libre','La notificación llega cuando se libera una sala y permite reservar al instante.','Prototipo 2, ahora funcional']
};
const pad=n=>String(n).padStart(2,'0');
const fmtT=s=>pad(Math.floor(s/60))+':'+pad(s%60);
const hm=(h,m=0)=>pad(Math.floor(h+m/60))+':'+pad(m%60);
const slot=()=>hm(S.hour)+' – '+hm(S.hour,S.dur);
const free=()=>ROOMS.filter(r=>r.st!=='busy'&&r.cap>=S.people&&[...S.feats].every(f=>r.feats.includes(f)));
const $=id=>document.getElementById(id);

function go(s,push=true){
  if(push&&S.screen!==s)S.hist.push(S.screen);
  S.screen=s;

function qr(){let s=7,c='';const R=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const f=(x,y)=>{const a=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(!a)return null;const lx=x>13?x-14:x,ly=y>13?y-14:y;return lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4)};
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const v=f(x,y);const on=v===null?R()>.5:v;if(on)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="-1 -1 23 23" width="190" height="190" fill="#0e1b33" style="background:#fff;border-radius:10px;padding:4px" role="img" aria-label="Código QR de la puerta">${c}</svg>`}

function roomArt(){return `<svg viewBox="0 0 320 130" style="width:100%;border-radius:14px;display:block"><rect width="320" height="130" fill="#dfe8f8"/><rect x="0" y="0" width="320" height="34" fill="#c9d8f3"/><rect x="118" y="8" width="84" height="40" rx="3" fill="#fff" stroke="#9fb4de"/><rect x="82" y="66" width="156" height="36" rx="6" fill="#b58a5b"/>${[100,140,180,214].map(x=>`<rect x="${x}" y="54" width="20" height="10" rx="4" fill="#0b3d91"/><rect x="${x}" y="104" width="20" height="10" rx="4" fill="#0b3d91"/>`).join('')}</svg>`}

function mapSvg(){const pin=r=>{const col={free:'#1f9d55',busy:'#c8372d',soon:'#e8b100'}[r.st];return `<g transform="translate(${r.x},${r.y})"><circle r="8" fill="${col}" stroke="#fff" stroke-width="2.5"/></g>`};
  const shown=ROOMS.filter(r=>r.st==='busy'||free().includes(r));
  return `<svg viewBox="0 0 280 130" style="width:100%;border-radius:14px;display:block" role="img" aria-label="Mapa del campus"><rect width="280" height="130" fill="#e8eef0"/><path d="M0 70 C70 60 120 84 280 62" stroke="#fff" stroke-width="9" fill="none"/><rect x="24" y="16" width="70" height="34" rx="5" fill="#cfd9ea"/><rect x="160" y="14" width="86" height="40" rx="5" fill="#cfd9ea"/><circle cx="130" cy="108" r="14" fill="#c4e2c8"/><circle cx="250" cy="106" r="11" fill="#c4e2c8"/><text x="28" y="34" font-size="9" font-weight="700" fill="#0b3d91" font-family="Figtree,sans-serif">Ad Portas</text><text x="166" y="32" font-size="9" font-weight="700" fill="#0b3d91" font-family="Figtree,sans-serif">Biblioteca</text>${shown.map(pin).join('')}</svg>`}

  $('steps').innerHTML='<h2>Pantallas</h2>'+STEPS.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([id,l])=>`<button data-s="${id}" ${id===S.screen?'aria-current="true"':''}>${l}</button>`).join('')).join('');
  const n=NOTES[S.screen];
  $('notes').innerHTML=`<div class="box"><h2>Qué mejoró</h2><h3>${n[0]}</h3><p>${n[1]}</p><div class="src">Aparece desde: ${n[2]}</div></div><div class="legend">Los botones con borde punteado son controles del prototipo que simulan situaciones reales (escanear un QR, dejar pasar el tiempo).</div>`;
  const b=sc.querySelector('.body');if(b)b.scrollTop=0;
}

document.addEventListener('click',e=>{
  const st=e.target.closest('[data-s]');
  if(st){const id=st.dataset.s;
    if(['confirm','checkin','active','warning','reminder'].includes(id)&&!S.cur){newRes()}
    if(id==='waitlist'){pickRoom('201');S.queue=false;ROOMS[2].st='busy'}
    if(id==='freed'){pickRoom('201');ROOMS[2].st='free'}
    S.hist=[];go(id,false);return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const [a,v]=el.dataset.a.split(':');
  const A={
    back:()=>back(), home:()=>{S.hist=[];go('home',false)},
    go:()=>go(v),
    mine:()=>go('reservas'),
    tab:()=>{if(v==='appHome'||v==='servicios'){S.hist=[];go(v,false)}else toast('Fuera del alcance de este prototipo')},
    other:()=>toast('Fuera del alcance de este prototipo'),
    open:()=>{const r=S.res.find(x=>String(x.id)===v);if(S.cur&&r&&r.id===S.cur.id){go(r.status==='Activa'?'active':'confirm')}else{toast('Reserva '+(r?r.status.toLowerCase():''))}},
    reset:()=>{S.res=[];S.cur=null;S.booked=false;try{localStorage.removeItem(KEY)}catch(e){};render();toast('Reservas borradas')},
    ppl:()=>{S.people=Math.min(8,Math.max(1,S.people+ +v));render()},
    hour:()=>{S.hour=+v;render()}, dur:()=>{S.dur=+v;render()},
    feat:()=>{S.feats.has(v)?S.feats.delete(v):S.feats.add(v);render()},
    room:()=>{pickRoom(v);if(S.room.st==='busy'){S.queue=false;go('waitlist')}else go('detail')},
    book:()=>{newRes();go('confirm')},
    scan:()=>go('active'),
    finish:()=>{setStatus('Finalizada');S.hist=[];go('home',false);toast('Sala liberada. ¡Gracias!')},
    cancel:()=>{setStatus('Cancelada');S.hist=[];go('home',false);toast('Reserva cancelada')},
    alt:()=>{if(v){pickRoom(v);go('detail')}else{go('alternatives')}},
    queue:()=>{S.queue=true;render();toast('Te uniste a la lista de espera')},
    freed:()=>{ROOMS[2].st='free';go('freed')},
    freedbook:()=>{pickRoom('201');go('detail')}
  };
  (A[a]||(()=>{}))();
});

// Liberación automática: tanto el aviso previo como el contador de check-in liberan la sala al llegar a 0
setInterval(()=>{const t=$('timer');if(t&&S.t>0){S.t--;t.textContent=fmtT(S.t);if((S.screen==='warning'||S.screen==='checkin')&&S.t===0)go('released')}},1000);
load();
render();
</script>
</body>
</html>
